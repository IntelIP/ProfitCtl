labels:
  pool: shared-kvm

when:
  - event: tag
    ref: refs/tags/v*.*.*

steps:
  - name: build-and-package
    image: golang:1.24
    commands:
      - apt-get update && apt-get install -y --no-install-recommends zip && rm -rf /var/lib/apt/lists/*
      - |
        TAG="$${CI_COMMIT_TAG:-$${CI_COMMIT_REF##refs/tags/}}"
        if [ -z "$${TAG}" ]; then TAG="$(bash scripts/release/resolve-tag.sh)"; fi
        test -n "$${TAG}" || (echo "TAG is required" && exit 1)
        bash scripts/release/build-artifacts.sh "$${TAG}"
        bash scripts/release/create-checksums.sh "$${TAG}"

  - name: publish-release-and-vps
    image: alpine:3.20
    environment:
      DOPPLER_TOKEN:
        from_secret: doppler_token
    commands:
      - test -n "$${DOPPLER_TOKEN}" || (echo "DOPPLER_TOKEN is required" && exit 1)
      - apk add --no-cache bash curl openssh-client rsync git gnupg github-cli
      - curl -Ls https://cli.doppler.com/install.sh | sh
      - |
        TAG="$${CI_COMMIT_TAG:-$${CI_COMMIT_REF##refs/tags/}}"
        if [ -z "$${TAG}" ]; then TAG="$(bash scripts/release/resolve-tag.sh)"; fi
        test -n "$${TAG}" || (echo "TAG is required" && exit 1)
        doppler run --project profitctl --config prd_ci_woodpecker -- bash scripts/release/publish-github-release.sh "$${TAG}"
        doppler run --project profitctl --config prd_ci_woodpecker -- bash deployment/releases/publish-to-vps.sh "$${TAG}"

---
labels:
  pool: shared-kvm

when:
  - event: pull_request
    branch: [main]

steps:
  - name: verify-go-quality
    image: golang:1.24
    commands:
      - go version
      - test -z "$(gofmt -l .)"
      - go mod tidy
      - git diff --exit-code go.mod go.sum
      - go vet ./...
      - go test ./...

  - name: semgrep
    image: semgrep/semgrep:1.154.0
    commands:
      - mkdir -p reports
      - semgrep scan --config p/default --sarif --sarif-output reports/semgrep.sarif . || echo '{"version":"2.1.0","runs":[]}' > reports/semgrep.sarif

  - name: trivy-fs
    image: aquasec/trivy:0.69.3
    commands:
      - mkdir -p reports
      - trivy fs --scanners vuln,misconfig,secret --format sarif -o reports/trivy.sarif . || echo '{"version":"2.1.0","runs":[]}' > reports/trivy.sarif

  - name: gitleaks
    image: ghcr.io/gitleaks/gitleaks:v8.30.0
    commands:
      - mkdir -p reports
      - gitleaks git --report-format sarif --report-path reports/gitleaks.sarif . || echo '{"version":"2.1.0","runs":[]}' > reports/gitleaks.sarif

  - name: osv
    image: ghcr.io/google/osv-scanner:v2.3.3
    commands:
      - mkdir -p reports
      - osv-scanner --recursive --json=reports/osv.json . || echo '{"results":[]}' > reports/osv.json

  - name: upload-findings
    image: curlimages/curl:8.11.0
    environment:
      APPSEC_API_URL:
        from_secret: APPSEC_API_URL
      APPSEC_API_TOKEN:
        from_secret: APPSEC_API_TOKEN
      APPSEC_STRICT_API:
        from_secret: APPSEC_STRICT_API
    commands:
      - sh scripts/ci/upload_scan.sh "$APPSEC_API_URL" "$CI_REPO" "$CI_COMMIT_SHA" semgrep sarif "$CI_COMMIT_PULL_REQUEST" reports/semgrep.sarif
      - sh scripts/ci/upload_scan.sh "$APPSEC_API_URL" "$CI_REPO" "$CI_COMMIT_SHA" trivy sarif "$CI_COMMIT_PULL_REQUEST" reports/trivy.sarif
      - sh scripts/ci/upload_scan.sh "$APPSEC_API_URL" "$CI_REPO" "$CI_COMMIT_SHA" gitleaks sarif "$CI_COMMIT_PULL_REQUEST" reports/gitleaks.sarif
      - sh scripts/ci/upload_scan.sh "$APPSEC_API_URL" "$CI_REPO" "$CI_COMMIT_SHA" osv json "$CI_COMMIT_PULL_REQUEST" reports/osv.json

  - name: evaluate-gate
    image: alpine:3.21
    environment:
      APPSEC_API_URL:
        from_secret: APPSEC_API_URL
      APPSEC_API_TOKEN:
        from_secret: APPSEC_API_TOKEN
      APPSEC_STRICT_API:
        from_secret: APPSEC_STRICT_API
    commands:
      - apk add --no-cache curl jq
      - sh scripts/ci/evaluate_gate.sh "$APPSEC_API_URL" "$CI_REPO" "$CI_COMMIT_PULL_REQUEST"

---
labels:
  pool: shared-kvm

when:
  - event: push
    branch: [main]

steps:
  - name: verify-main
    image: golang:1.24
    commands:
      - go version
      - test -z "$(gofmt -l .)"
      - go mod tidy
      - git diff --exit-code go.mod go.sum
      - go vet ./...
      - go test ./...
