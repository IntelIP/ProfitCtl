name: wp-tag-release

labels:
  pool: shared-kvm

when:
  - event: [tag, push]
    ref: refs/tags/v*.*.*

steps:
  - name: build-and-package
    image: golang:1.24
    commands:
      - export TAG="${CI_COMMIT_TAG}"
      - apt-get update && apt-get install -y --no-install-recommends zip && rm -rf /var/lib/apt/lists/*
      - bash scripts/release/build-artifacts.sh "${TAG}"
      - bash scripts/release/create-checksums.sh "${TAG}"

  - name: publish-release-and-vps
    image: alpine:3.20
    environment:
      doppler_token:
        from_secret: doppler_token_org
    commands:
      - test -n "${doppler_token:-}" || (echo "DOPPLER_TOKEN is required" && exit 1)
      - export DOPPLER_TOKEN="${doppler_token}"
      - apk add --no-cache bash curl openssh-client rsync git
      - curl -Ls https://cli.doppler.com/install.sh | sh
      - doppler run --project profitctl --config prd_ci_woodpecker -- bash scripts/release/publish-github-release.sh "${CI_COMMIT_TAG}"
      - doppler run --project profitctl --config prd_ci_woodpecker -- bash deployment/releases/publish-to-vps.sh "${CI_COMMIT_TAG}"

---
name: wp-pr-fast

labels:
  pool: shared-kvm

when:
  - event: pull_request
    branch: [main]

steps:
  - name: verify-go-quality
    image: golang:1.24
    commands:
      - go version
      - test -z "$(gofmt -l .)"
      - go mod tidy
      - git diff --exit-code go.mod go.sum
      - go vet ./...
      - go test ./...

---
name: wp-main-verify

labels:
  pool: shared-kvm

when:
  - event: push
    branch: [main]

steps:
  - name: verify-main
    image: golang:1.24
    commands:
      - go version
      - test -z "$(gofmt -l .)"
      - go mod tidy
      - git diff --exit-code go.mod go.sum
      - go vet ./...
      - go test ./...
