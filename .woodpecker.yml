labels:
  pool: shared-kvm

when:
  - event: tag
    ref: refs/tags/v*.*.*

steps:
  - name: build-and-package
    image: golang:1.24
    commands:
      - test -n "${CI_COMMIT_TAG:-${CI_COMMIT_REF#refs/tags/}}" || (echo "TAG is required" && exit 1)
      - apt-get update && apt-get install -y --no-install-recommends zip && rm -rf /var/lib/apt/lists/*
      - bash scripts/release/build-artifacts.sh "${CI_COMMIT_TAG:-${CI_COMMIT_REF#refs/tags/}}"
      - bash scripts/release/create-checksums.sh "${CI_COMMIT_TAG:-${CI_COMMIT_REF#refs/tags/}}"

  - name: publish-release-and-vps
    image: alpine:3.20
    environment:
      DOPPLER_TOKEN:
        from_secret: doppler_token_org
      doppler_token:
        from_secret: doppler_token_org
    commands:
      - test -n "${DOPPLER_TOKEN:-${doppler_token:-}}" || (echo "DOPPLER_TOKEN is required" && exit 1)
      - apk add --no-cache bash curl openssh-client rsync git
      - curl -Ls https://cli.doppler.com/install.sh | sh
      - DOPPLER_TOKEN="${DOPPLER_TOKEN:-${doppler_token:-}}" doppler run --project profitctl --config prd_ci_woodpecker -- bash scripts/release/publish-github-release.sh "${CI_COMMIT_TAG:-${CI_COMMIT_REF#refs/tags/}}"
      - DOPPLER_TOKEN="${DOPPLER_TOKEN:-${doppler_token:-}}" doppler run --project profitctl --config prd_ci_woodpecker -- bash deployment/releases/publish-to-vps.sh "${CI_COMMIT_TAG:-${CI_COMMIT_REF#refs/tags/}}"

---
labels:
  pool: shared-kvm

when:
  - event: pull_request
    branch: [main]

steps:
  - name: verify-go-quality
    image: golang:1.24
    commands:
      - go version
      - test -z "$(gofmt -l .)"
      - go mod tidy
      - git diff --exit-code go.mod go.sum
      - go vet ./...
      - go test ./...

---
labels:
  pool: shared-kvm

when:
  - event: push
    branch: [main]

steps:
  - name: verify-main
    image: golang:1.24
    commands:
      - go version
      - test -z "$(gofmt -l .)"
      - go mod tidy
      - git diff --exit-code go.mod go.sum
      - go vet ./...
      - go test ./...
