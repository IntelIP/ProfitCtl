    amount: 100
    period: monthly
    layer: infrastructure

variable_costs: []

pricing:
  mode: workspace_hybrid
  workspace:
    average_users_per_workspace: 2
  plans:
    - name: Minimum
      price: 0
      share: 0.8
      workspace_minimum: 149
    - name: Pro
      price: 39
