project:
  name: Open Core Mix Benchmark

fixed_costs:
  - name: Base Infrastructure
    amount: 500
    period: monthly
    layer: infrastructure

variable_costs:
  - name: API Calls
    cost_per_unit: 0.0001
    units_per_user: 10000
    distribution: normal
    mean: 10000
    stddev: 2000
    layer: application

pricing:
  mode: mix
  plans:
    - name: free
      price: 0
      share: 0.50
      cohort: free
    - name: starter
      price: 10
      share: 0.30
      cohort: paid
    - name: pro
      price: 29
      share: 0.20
      cohort: paid

payment_fees:
  processor: stripe
  currency: usd
  free_user_fee:
    monthly_percent: 0
    per_transaction: 0
  paid_user_fee:
    monthly_percent: 2.9
    annual_percent: 2.0
    per_transaction: 0.30
  billing_mix:
    monthly_share: 0.80
    annual_share: 0.20
  assumptions:
    annual_discount_percent: 15
    annual_prepaid_months: 12

covenants:
  - type: threshold
    field: margin
    operator: gte
    value: 20
    message: Booked margin must be >= 20%

simulation:
  base_users: 100
  growth_factor: 1.25
  iterations: 5000
