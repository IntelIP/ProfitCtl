project:
  name: Hybrid Pilot Contract Benchmark

fixed_costs:
  - name: Platform baseline
    amount: 100
    period: monthly
    layer: infrastructure

variable_costs: []

pricing:
  mode: hybrid
  contract:
    base_platform_fee: 500
    per_seat_fee: 25
    workspace_minimum: 2000
    included_seats: 10
    pilot:
      setup_fee: 5000
      monthly_fee: 1500
      duration_months: 3

payment_fees:
  processor: stripe
  currency: usd
  paid_user_fee:
    monthly_percent: 2.9
    annual_percent: 2.0
    per_transaction: 0.30
  billing_mix:
    monthly_share: 1.0
    annual_share: 0.0
  assumptions:
    annual_prepaid_months: 12

covenants:
  - type: threshold
    field: operating_margin
    operator: gte
    value: 20
    message: Operating margin must be >= 20%

simulation:
  base_users: 50
  billable_users: 40
  growth_factor: 1.05
  iterations: 500
