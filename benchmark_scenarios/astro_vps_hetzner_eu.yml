# Astro on Hetzner Cloud (EU pricing, CX22)
project:
  name: "Astro VPS - Hetzner CX22 (EU)"

fixed_costs:
  - name: "Hetzner CX22 (EU pricing)"
    amount: 3.79
    period: monthly
    layer: infrastructure

variable_costs:
  - name: "Bandwidth egress (conservative)"
    cost_per_unit: 0.00117
