name: Feature request
description: Propose an improvement or new capability.
title: "[feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What gap or workflow friction are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful change that would solve it.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: User value
      description: Explain why this matters for users or contributors.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include other approaches you rejected, if any.
    validations:
      required: false
