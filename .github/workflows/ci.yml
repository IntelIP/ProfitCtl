name: GitHub CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Verify Go developer fallback identity
        run: |
          GOBIN="${RUNNER_TEMP}/go-bin"
          mkdir -p "${GOBIN}"
          GOBIN="${GOBIN}" go install ./cmd/profitctl
          test -x "${GOBIN}/profitctl"
          test "$("${GOBIN}/profitctl" --version)" = "profitctl dev"

  verify-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Verify installer syntax
        run: bash -n scripts/install.sh

      - name: Build local release artifacts
        run: |
          TAG=v0.0.0-ci
          bash scripts/release/build-artifacts.sh "${TAG}"
          bash scripts/release/create-checksums.sh "${TAG}"
          ARCHIVE_ROOT="profitctl_${TAG}_linux_amd64"
          tar -tzf "dist/${TAG}/${ARCHIVE_ROOT}.tar.gz" | grep -Fx "${ARCHIVE_ROOT}/profitctl-standards"
          tar -tzf "dist/${TAG}/${ARCHIVE_ROOT}.tar.gz" | grep -Fx "${ARCHIVE_ROOT}/skills/profitctl-cost-aware/SKILL.md"
          tar -tzf "dist/${TAG}/${ARCHIVE_ROOT}.tar.gz" | grep -Fx "${ARCHIVE_ROOT}/skills/profitctl-cost-aware/agents/openai.yaml"
          tar -tzf "dist/${TAG}/${ARCHIVE_ROOT}.tar.gz" | grep -Fx "${ARCHIVE_ROOT}/skills/profitctl-cost-aware/scripts/run_profitctl_scenarios.py"
          tar -tzf "dist/${TAG}/${ARCHIVE_ROOT}.tar.gz" | grep -Fx "${ARCHIVE_ROOT}/skills/profitctl-cost-aware/bin/profitctl"
          tar -tzf "dist/${TAG}/${ARCHIVE_ROOT}.tar.gz" | grep -Fx "${ARCHIVE_ROOT}/skills/profitctl-cost-aware/bin/profitctl-standards"

      - name: Verify Bun package
        run: |
          TAG=v0.0.0-ci
          bash scripts/release/prepare-bun-package.sh "${TAG}"
          BUN_INSTALL_GLOBAL_DIR="${RUNNER_TEMP}/bun-global" \
          BUN_INSTALL_BIN="${RUNNER_TEMP}/bun-bin" \
            bun add --global "${GITHUB_WORKSPACE}/dist/${TAG}/profitctl-0.0.0-ci.tgz"
          "${RUNNER_TEMP}/bun-bin/profitctl" --help >/dev/null
          "${RUNNER_TEMP}/bun-bin/profitctl" mcp --workspace-root "${GITHUB_WORKSPACE}" </dev/null

      - name: Build local mirror layout
        run: |
          TAG=v0.0.0-ci
          MIRROR_ROOT="${RUNNER_TEMP}/profitctl-mirror"
          mkdir -p "${MIRROR_ROOT}/releases/${TAG}" "${MIRROR_ROOT}/current"
          cp "dist/${TAG}/profitctl_${TAG}_"* "dist/${TAG}/SHA256SUMS" "${MIRROR_ROOT}/releases/${TAG}/"
          printf '{"latest":"%s"}\n' "${TAG}" > "${MIRROR_ROOT}/current/index.json"
          echo "PROFITCTL_TEST_MIRROR=file://${MIRROR_ROOT}" >> "${GITHUB_ENV}"

      - name: Run installer smoke test
        run: |
          INSTALL_DIR="${RUNNER_TEMP}/profitctl-bin"
          TEST_HOME="${RUNNER_TEMP}/profitctl-home"
          TEST_CODEX_HOME="${RUNNER_TEMP}/codex-home"
          mkdir -p "${INSTALL_DIR}"
          mkdir -p "${TEST_HOME}"
          PROFITCTL_DOWNLOAD_BASE_URL="${PROFITCTL_TEST_MIRROR}" \
          PROFITCTL_VERSION=v0.0.0-ci \
          PROFITCTL_INSTALL_DIR="${INSTALL_DIR}" \
          CODEX_HOME="${TEST_CODEX_HOME}" \
          bash scripts/install.sh
          test -f "${TEST_CODEX_HOME}/skills/profitctl-cost-aware/SKILL.md"
          test -f "${TEST_CODEX_HOME}/skills/profitctl-cost-aware/agents/openai.yaml"
          test -x "${TEST_CODEX_HOME}/skills/profitctl-cost-aware/scripts/run_profitctl_scenarios.py"
          test -x "${TEST_CODEX_HOME}/skills/profitctl-cost-aware/bin/profitctl"
          test -x "${TEST_CODEX_HOME}/skills/profitctl-cost-aware/bin/profitctl-standards"
          "${INSTALL_DIR}/profitctl" mcp --workspace-root "${GITHUB_WORKSPACE}" </dev/null
          PATH="/usr/bin:/bin" \
            python3 "${TEST_CODEX_HOME}/skills/profitctl-cost-aware/scripts/run_profitctl_scenarios.py" \
              --template cloud-run-ai-saas > "${RUNNER_TEMP}/skill-result.json"
          python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); assert data["status"] == "ok"; assert len(data["scenarios"]) == 1' "${RUNNER_TEMP}/skill-result.json"
          "${TEST_CODEX_HOME}/skills/profitctl-cost-aware/bin/profitctl-standards" \
            "${TEST_CODEX_HOME}/skills/profitctl-cost-aware/references/templates/cloud-run-ai-saas.yml" \
            > "${RUNNER_TEMP}/standards-result.json"
          python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); assert data["passed"] is True' "${RUNNER_TEMP}/standards-result.json"
          env -i \
            HOME="${TEST_HOME}" \
            PATH="${INSTALL_DIR}:/usr/bin:/bin" \
            CONFIG_FILE="${GITHUB_WORKSPACE}/examples/mix_profit.yml" \
            CATALOG_FILE="${GITHUB_WORKSPACE}/test/fixtures/provider_catalog_valid.yml" \
            sh -eu <<'EOF'
          test "$(command -v profitctl)" = "${PATH%%:*}/profitctl"
          test "$(profitctl --version)" = "profitctl v0.0.0-ci"
          test "$(profitctl version)" = "profitctl v0.0.0-ci"
          profitctl --help >/dev/null
          profitctl validate -f "${CONFIG_FILE}" >/dev/null
          profitctl doctor -f "${CONFIG_FILE}" --catalog "${CATALOG_FILE}" >/dev/null

          set +e
          doctor_output="$(profitctl doctor -f "${HOME}/missing-profit.yml" --catalog "${HOME}/missing-catalog.yml" 2>&1)"
          doctor_status=$?
          set -e
          test "${doctor_status}" -eq 2
          printf '%s\n' "${doctor_output}" | grep -F "[fail] config:" >/dev/null
          printf '%s\n' "${doctor_output}" | grep -F "profitctl init --file" >/dev/null
          printf '%s\n' "${doctor_output}" | grep -F "[fail] catalog:" >/dev/null
          printf '%s\n' "${doctor_output}" | grep -F "no fallback or local state change was performed" >/dev/null
          EOF

  verify-website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Run scanners
        run: |
          set -euo pipefail
          mkdir -p reports

          docker run --rm --entrypoint semgrep -v "$PWD:/src" -w /src semgrep/semgrep:1.154.0 \
            scan --config p/default --sarif --sarif-output reports/semgrep.sarif . \
            || echo "semgrep exited non-zero; preserving report if present"
          [ -f reports/semgrep.sarif ] || echo '{"version":"2.1.0","runs":[]}' > reports/semgrep.sarif

          docker run --rm --entrypoint trivy -v "$PWD:/src" -w /src aquasec/trivy:0.69.3 \
            fs --scanners vuln,misconfig,secret --format sarif -o reports/trivy.sarif . \
            || echo "trivy exited non-zero; preserving report if present"
          [ -f reports/trivy.sarif ] || echo '{"version":"2.1.0","runs":[]}' > reports/trivy.sarif

          docker run --rm --entrypoint gitleaks -v "$PWD:/src" -w /src ghcr.io/gitleaks/gitleaks:v8.30.0 \
            git --report-format sarif --report-path reports/gitleaks.sarif . \
            || echo "gitleaks exited non-zero; preserving report if present"
          [ -f reports/gitleaks.sarif ] || echo '{"version":"2.1.0","runs":[]}' > reports/gitleaks.sarif

          docker run --rm --entrypoint osv-scanner -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.3.3 \
            scan --recursive --format json --output reports/osv.json . \
            || echo "osv-scanner exited non-zero; preserving report if present"
          [ -f reports/osv.json ] || echo '{"results":[]}' > reports/osv.json

      - name: Upload scan findings
        env:
          APPSEC_API_URL: ${{ secrets.APPSEC_API_URL }}
          APPSEC_API_TOKEN: ${{ secrets.APPSEC_API_TOKEN }}
          APPSEC_STRICT_API: ${{ vars.APPSEC_STRICT_API || 'false' }}
          CI_PIPELINE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          upload() {
            tool="$1"
            format="$2"
            report="$3"
            if [ -n "${PR_NUMBER}" ]; then
              sh scripts/ci/upload_scan.sh "$APPSEC_API_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$tool" "$format" "$PR_NUMBER" "$report"
            else
              sh scripts/ci/upload_scan.sh "$APPSEC_API_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$tool" "$format" "$report"
            fi
          }

          upload semgrep sarif reports/semgrep.sarif
          upload trivy sarif reports/trivy.sarif
          upload gitleaks sarif reports/gitleaks.sarif
          upload osv json reports/osv.json

      - name: Evaluate policy gate
        if: github.event_name == 'pull_request'
        env:
          APPSEC_API_URL: ${{ secrets.APPSEC_API_URL }}
          APPSEC_API_TOKEN: ${{ secrets.APPSEC_API_TOKEN }}
          APPSEC_STRICT_API: ${{ vars.APPSEC_STRICT_API || 'false' }}
        run: |
          sh scripts/ci/evaluate_gate.sh "$APPSEC_API_URL" "$GITHUB_REPOSITORY" "${{ github.event.pull_request.number }}"
