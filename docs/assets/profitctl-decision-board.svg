<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title description">
  <title id="title">ProfitCtl scenario comparison</title>
  <desc id="description">A comparison of the committed hybrid steady-state and pilot fixtures. The steady-state scenario has a 95 percent operating margin and two dollar cost per user. The pilot scenario has higher revenue and a 69 percent operating margin.</desc>
  <rect width="1440" height="810" rx="28" fill="#111315"/>
  <rect x="32" y="32" width="1376" height="746" rx="20" fill="#171A1D" stroke="#333941" stroke-width="2"/>

  <g font-family="Instrument Sans, Arial, sans-serif">
    <g transform="translate(76 78)">
      <rect width="48" height="48" rx="12" fill="#111315" stroke="#333941" stroke-width="2"/>
      <path d="M18 37V13h10c6 0 10 4 10 9s-4 9-10 9H18" fill="none" stroke="#B8FF18" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
      <path d="M13 37h24" fill="none" stroke="#EEF2F7" stroke-linecap="round" stroke-width="2"/>
      <circle cx="33" cy="37" r="2.5" fill="#B8FF18"/>
      <text x="66" y="20" fill="#EEF2F7" font-size="23" font-weight="600">ProfitCtl</text>
      <text x="66" y="42" fill="#A9AFB8" font-size="14" font-weight="500">Scenario comparison</text>
    </g>

    <g transform="translate(76 160)">
      <rect width="1288" height="48" rx="10" fill="#0A0A0A" stroke="#333941" stroke-width="2"/>
      <circle cx="26" cy="24" r="6" fill="#B8FF18"/>
      <text x="46" y="30" fill="#EEF2F7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">$ profitctl compare examples/hybrid_steady_profit.yml examples/hybrid_profit.yml</text>
    </g>

    <g transform="translate(76 242)">
      <text x="0" y="0" fill="#A9AFB8" font-size="14" font-weight="600" letter-spacing="1.4">COMMITTED FIXTURE OUTPUT</text>
      <text x="0" y="42" fill="#EEF2F7" font-size="30" font-weight="600">Compare revenue against recurring-margin health.</text>
      <text x="0" y="70" fill="#A9AFB8" font-size="17">The steady-state fixture leads on operating margin and cost per user. The pilot fixture leads on revenue.</text>
    </g>

    <g transform="translate(76 360)">
      <rect width="618" height="252" rx="16" fill="#111315" stroke="#B8FF18" stroke-width="2"/>
      <rect x="24" y="24" width="118" height="30" rx="15" fill="#20300C"/>
      <text x="40" y="45" fill="#B8FF18" font-size="13" font-weight="600">BASELINE</text>
      <text x="24" y="88" fill="#EEF2F7" font-size="22" font-weight="600">Hybrid steady-state</text>
      <text x="24" y="114" fill="#A9AFB8" font-size="15">Highest operating margin · Lowest cost per user</text>
      <line x1="24" y1="140" x2="594" y2="140" stroke="#333941" stroke-width="2"/>
      <text x="24" y="171" fill="#A9AFB8" font-size="13" font-weight="500">REVENUE</text>
      <text x="24" y="209" fill="#EEF2F7" font-size="31" font-weight="600">$2,000</text>
      <text x="230" y="171" fill="#A9AFB8" font-size="13" font-weight="500">OPERATING MARGIN</text>
      <text x="230" y="209" fill="#B8FF18" font-size="31" font-weight="600">95.00%</text>
      <text x="442" y="171" fill="#A9AFB8" font-size="13" font-weight="500">COST / USER</text>
      <text x="442" y="209" fill="#EEF2F7" font-size="31" font-weight="600">$2.00</text>
      <rect x="494" y="22" width="100" height="32" rx="16" fill="#123C32"/>
      <text x="519" y="44" fill="#A7F3D0" font-size="13" font-weight="700">PASS</text>
    </g>

    <g transform="translate(746 360)">
      <rect width="618" height="252" rx="16" fill="#111315" stroke="#333941" stroke-width="2"/>
      <rect x="24" y="24" width="78" height="30" rx="15" fill="#102753"/>
      <text x="40" y="45" fill="#8FB1FF" font-size="13" font-weight="600">PILOT</text>
      <text x="24" y="88" fill="#EEF2F7" font-size="22" font-weight="600">Hybrid pilot</text>
      <text x="24" y="114" fill="#A9AFB8" font-size="15">Highest revenue · One-time setup fee included</text>
      <line x1="24" y1="140" x2="594" y2="140" stroke="#333941" stroke-width="2"/>
      <text x="24" y="171" fill="#A9AFB8" font-size="13" font-weight="500">REVENUE</text>
      <text x="24" y="209" fill="#EEF2F7" font-size="31" font-weight="600">$6,500</text>
      <text x="230" y="171" fill="#A9AFB8" font-size="13" font-weight="500">OPERATING MARGIN</text>
      <text x="230" y="209" fill="#8FB1FF" font-size="31" font-weight="600">69.00%</text>
      <text x="442" y="171" fill="#A9AFB8" font-size="13" font-weight="500">COST / USER</text>
      <text x="442" y="209" fill="#EEF2F7" font-size="31" font-weight="600">$12.40</text>
      <rect x="494" y="22" width="100" height="32" rx="16" fill="#123C32"/>
      <text x="519" y="44" fill="#A7F3D0" font-size="13" font-weight="700">PASS</text>
    </g>

    <g transform="translate(76 650)">
      <rect width="1288" height="82" rx="14" fill="#0A0A0A" stroke="#333941" stroke-width="2"/>
      <circle cx="36" cy="41" r="12" fill="#B8FF18"/>
      <path d="M30 41l4 4 8-9" fill="none" stroke="#111315" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
      <text x="72" y="34" fill="#EEF2F7" font-size="17" font-weight="600">Decision evidence, not a forecast.</text>
      <text x="72" y="58" fill="#A9AFB8" font-size="15">Values are generated from the committed hybrid examples. Re-run the command above with your own assumptions before deciding.</text>
    </g>
  </g>
</svg>
