[project]
name = "profitctl-agent"
version = "0.1.0"
description = "A local, restartable economic investigation agent for ProfitCtl"
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents==0.7.29",
    "langchain>=1.4.7,<2",
    "langchain-openai>=1.7.2,<2",
    "langgraph>=1.2.16,<2",
    "langgraph-checkpoint-sqlite==3.1.3",
    "mcp>=1.30,<2",
    "pydantic>=2.12,<3",
]

[project.scripts]
profitctl-agent = "profitctl_agent.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
